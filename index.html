<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 입사자 QR 등록</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#f2f3f5;color:#222;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 14px}
h2{font-size:17px;margin:22px 0 8px;border-bottom:2px solid #333;padding-bottom:4px}
label{display:block;margin:12px 0 4px;font-weight:bold;font-size:14px}
label .r{color:#c00}
input[type=text],input[type=tel],input[type=password],select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #999;border-radius:6px;background:#fff}
button,.btn{display:inline-block;padding:12px 16px;font-size:15px;border:1px solid #333;background:#fff;border-radius:6px;cursor:pointer;color:#222;text-decoration:none}
button.pri,.btn.pri{background:#1f4e9c;color:#fff;border-color:#1f4e9c}
button.big{width:100%;padding:16px;font-size:17px;margin-top:10px}
button.sm{padding:7px 10px;font-size:13px}
.card{background:#fff;border:1px solid #ccc;border-radius:8px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:#666;font-size:13px}
.ok{color:#0a7d2c;font-weight:bold}.no{color:#c00;font-weight:bold}
.photo{border:2px dashed #888;border-radius:8px;padding:10px;text-align:center;background:#fff}
.photo img{max-width:100%;max-height:220px;display:block;margin:8px auto 0}
canvas.sig{width:100%;height:150px;border:1px solid #999;border-radius:6px;background:#fff;touch-action:none}
.consent{border:1px solid #bbb;background:#fafafa;padding:10px;font-size:13px;line-height:1.6;max-height:180px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);overflow:auto;padding:16px;z-index:9}
.modal img{max-width:100%;display:block;margin:10px auto;background:#fff}
.tabs button.on{background:#333;color:#fff}
/* ---- 인쇄용 서식 ---- */
.paper{background:#fff;width:210mm;max-width:100%;margin:10px auto;padding:14mm 16mm;box-shadow:0 0 6px #aaa;font-size:11pt;line-height:1.7;color:#000}
.paper h3{text-align:center;font-size:20pt;margin:0 0 12px;letter-spacing:2px}
.paper .b{display:inline-block;min-width:40px;border-bottom:1px solid #000;text-align:center;padding:0 4px}
.paper .b.w{min-width:90px}.paper .b.x{min-width:160px}
.paper .n{font-size:10pt}
table.f{width:100%;border-collapse:collapse;margin:6px 0}
table.f td,table.f th{border:1px solid #000;padding:5px 7px;font-size:10.5pt}
table.f th{background:#f0f0f0;font-weight:normal;text-align:center}
.sigimg{height:36px;vertical-align:middle}
.paper [data-e]{background:#fff8d6;outline:none}
.paper [data-e]:focus{background:#ffef9a}
.paper .ck{cursor:pointer;font-size:13pt;padding:0 2px}
table.f td{height:28px}
@page{size:A4;margin:10mm}
@media print{
 body{background:#fff}.no-print{display:none!important}
 .paper [data-e]{background:none!important}
 .paper{box-shadow:none;margin:0;padding:0;width:auto}
 .wrap{padding:0;max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { CONFIG } from './config.js';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, setDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const configured = !!(CONFIG.firebase && CONFIG.firebase.apiKey && !/^여기/.test(CONFIG.firebase.apiKey));
let db, auth;
if (configured) { const app = initializeApp(CONFIG.firebase); db = getFirestore(app); auth = getAuth(app); }
const COL = 'workers';

/* ============ 공통 도우미 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const dateParts = () => { const d = new Date(); return [d.getFullYear(), d.getMonth()+1, d.getDate()]; };
const maskRrn = v => (v || '').replace(/^(\d{6})-?(\d)\d*$/, '$1-$2******');
const printRrn = v => (v && v.length > 8) ? v : maskRrn(v);
const fmtRrn = v => { const d = v.replace(/\D/g, '').slice(0, 13); return d.length > 6 ? d.slice(0, 6) + '-' + d.slice(6) : d; };
const fmtTel = v => { const d = v.replace(/\D/g, '').slice(0, 11); if (d.length < 4) return d; if (d.length < 8) return d.slice(0,3)+'-'+d.slice(3); return d.slice(0,3)+'-'+d.slice(3,d.length-4)+'-'+d.slice(-4); };


/* ============ 사진 축소 / 서명 ============ */
function shrink(file, max = 900) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      let q = 0.7, out; do { out = c.toDataURL('image/jpeg', q); q -= 0.1; } while (out.length > 350000 && q > 0.25); res(out);
    };
    img.onerror = rej;
    img.src = u;
  });
}
function sigPad(cv) {
  const x = cv.getContext('2d'); x.lineWidth = 3; x.lineCap = 'round'; x.strokeStyle = '#000';
  let down = false, has = false;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
  cv.onpointerdown = e => { down = true; has = true; const [a, b] = pt(e); x.beginPath(); x.moveTo(a, b); x.lineTo(a + .1, b + .1); x.stroke(); cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if (!down) return; const [a, b] = pt(e); x.lineTo(a, b); x.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => { down = false; };
  return { has: () => has, clear: () => { x.clearRect(0, 0, cv.width, cv.height); has = false; }, data: () => cv.toDataURL('image/png') };
}


/* ============ 상태 / 라우터 ============ */
let user = null, authReady = false, workers = [], dataReady = false, unsub = null;
const pageOf = () => location.hash.replace(/^#\/?/, '').split('/')[0];
const isAdminPage = () => ['admin', 'print', 'edit'].includes(pageOf());
const loading = () => { $('#app').innerHTML = '<div class="wrap"><p class="muted">불러오는 중...</p></div>'; };

function setupAuth() {
  onAuthStateChanged(auth, u => {
    user = u; authReady = true;
    if (u && !unsub) {
      unsub = onSnapshot(query(collection(db, COL), orderBy('createdAt', 'desc')), snap => {
        const first = !dataReady;
        workers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        dataReady = true;
        if (first || pageOf() === 'admin') route();
      }, err => alert('데이터를 불러오지 못했습니다: ' + err.message));
    }
    if (!u && unsub) { unsub(); unsub = null; workers = []; dataReady = false; }
    if (isAdminPage()) route();
  });
}

function route() {
  const [page, a, b] = location.hash.replace(/^#\/?/, '').split('/');
  if (!configured) return viewSetup();
  if (page === 'register') return viewRegister();
  if (page === 'admin' || page === 'print' || page === 'edit') {
    if (!authReady) return loading();
    if (!user) return viewLogin();
    if (!dataReady) return loading();
    if (page === 'edit') { const w = workers.find(x => x.id === a); return w ? renderForm({ id: w.id, f: w, admin: true }) : viewAdmin(); }
    return page === 'admin' ? viewAdmin() : viewPrint(a, b);
  }
  return viewHome();
}
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); route(); });

/* ============ 첫 화면 / 설정 안내 / 로그인 ============ */
function viewSetup() {
  $('#app').innerHTML = `<div class="wrap"><h1>설정이 필요합니다</h1>
   <div class="card">config.js 파일의 firebase 항목이 아직 비어 있습니다.<br>설치안내.md 의 7번 단계를 진행해 주세요.</div></div>`;
}
function viewHome() {
  $('#app').innerHTML = `<div class="wrap">
    <h1>${esc(CONFIG.appName)}</h1>
    ${CONFIG.siteName ? `<div class="muted">${esc(CONFIG.siteName)}</div>` : ''}
    <div class="card">
      <b>신규 입사자 등록</b><div class="muted">입사서류 정보와 신분증·이수증 사진을 등록합니다.</div>
      <a class="btn pri big" style="display:block;text-align:center;margin-top:10px" href="#/register">등록하기</a>
    </div>
    <p class="muted"><a href="#/admin">관리자 로그인</a></p></div>`;
}
function viewLogin() {
  $('#app').innerHTML = `<div class="wrap"><h1>관리자 로그인</h1>
   <label>이메일</label><input type="text" id="em" autocomplete="username" autocapitalize="off">
   <label>비밀번호</label><input type="password" id="pw" autocomplete="current-password">
   <button class="pri big" id="go">로그인</button>
   <p class="muted">현장소장 · 관리감독자 · 안전관리자 공용 계정으로 로그인합니다.</p>
   <p><a href="#/">← 처음으로</a></p></div>`;
  const go = async () => {
    try { await signInWithEmailAndPassword(auth, $('#em').value.trim(), $('#pw').value); }
    catch { alert('로그인에 실패했습니다. 이메일과 비밀번호를 확인해 주세요.'); }
  };
  $('#go').onclick = go;
  $('#pw').onkeydown = e => { if (e.key === 'Enter') go(); };
}

/* ============ 근로자 등록 / 수정 화면 (로그인 없음) ============ */
const MY_KEY = 'qrReg_my_v1';
let startNew = false;
const loadMine = () => { try { return JSON.parse(localStorage.getItem(MY_KEY) || 'null'); } catch { return null; } };
const saveMine = o => { try { localStorage.setItem(MY_KEY, JSON.stringify(o)); } catch {} };
const newId = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a, b => b.toString(16).padStart(2, '0')).join(''); };

function viewRegister() {
  const mine = loadMine();
  if (mine && mine.id && mine.f && !startNew) return viewMine(mine);
  startNew = false;
  renderForm(null);
}
function viewMine(mine) {
  $('#app').innerHTML = `<div class="wrap"><h1>이미 등록하셨습니다</h1>
   <div class="card"><b>${esc(mine.f.name)}</b> 님 <span class="muted">${esc(mine.f.co)} / ${esc(mine.f.job)}</span><br>
    <span class="muted">잘못 입력한 내용은 수정할 수 있습니다. (안전교육 완료 처리 전까지)</span></div>
   <button class="pri big" id="m_edit">내 정보 수정하기</button>
   <button class="big" id="m_new">다른 사람 새로 등록하기</button></div>`;
  $('#m_edit').onclick = () => renderForm({ id: mine.id, f: mine.f, admin: false });
  $('#m_new').onclick = () => { if (confirm('다른 사람을 새로 등록하면, 이 휴대폰에서는 앞서 등록한 ' + mine.f.name + ' 님의 정보를 더 이상 수정할 수 없게 됩니다.\n계속할까요?')) { startNew = true; renderForm(null); } };
}
function renderForm(ctx) {
  const edit = !!ctx, admin = !!(ctx && ctx.admin), f = (ctx && ctx.f) || {};
  const val = k => esc(f[k] || '');
  const prev = (k, label) => (admin && f[k]) ? `<img id="v_${label}" src="${f[k]}" alt="">` : `<img id="v_${label}" alt="">`;
  $('#app').innerHTML = `<div class="wrap">
  ${admin ? '<a href="#/admin">← 관리자 화면</a>' : ''}
  <h1>${edit ? (admin ? '등록 정보 수정 (관리자)' : '등록 정보 수정') : '신규 입사자 등록'}</h1>
  ${CONFIG.siteName ? `<div class="muted">${esc(CONFIG.siteName)}</div>` : ''}
  <div class="muted">빨간 * 표시는 필수 항목입니다.</div>
  <h2>1. 인적사항</h2>
  <label>성명 <span class="r">*</span></label><input type="text" id="f_name" autocomplete="off" value="${val('name')}">
  <label>주민등록번호 / 외국인등록번호 <span class="r">*</span></label><input type="tel" id="f_rrn" placeholder="000000-0000000" inputmode="numeric" value="${val('rrn')}">
  ${edit && !CONFIG.storeFullRrn ? '<div class="muted">뒷자리는 저장하지 않습니다. 번호를 바꿀 때만 13자리를 다시 입력하세요.</div>' : ''}
  <label>국적 <span class="r">*</span></label><input type="text" id="f_nat" placeholder="예: 대한민국, 베트남, 중국" value="${val('nat')}">
  <label>연락처 <span class="r">*</span></label><input type="tel" id="f_tel" placeholder="010-0000-0000" value="${val('tel')}">
  <label>주소 <span class="r">*</span></label><input type="text" id="f_addr" value="${val('addr')}">
  <label>소속(협력업체) <span class="r">*</span></label><input type="text" id="f_co" value="${val('co')}">
  <label>직종 <span class="r">*</span></label><input type="text" id="f_job" placeholder="예: 철근공, 형틀목공, 보통인부" value="${val('job')}">
  <h2>2. 사진 등록</h2>
  ${edit ? '<div class="muted">사진은 이미 등록되어 있습니다. 바꿀 때만 새로 선택하세요.</div>' : ''}
  <label>신분증 사진 ${edit ? '' : '<span class="r">*</span>'}</label>
  <div class="photo"><input type="file" accept="image/*" id="p_id">${prev('idPhoto', 'id')}</div>
  <label>기초안전보건교육 이수증 사진 ${edit ? '' : '<span class="r">*</span>'}</label>
  <div class="photo"><input type="file" accept="image/*" id="p_cert">${prev('certPhoto', 'cert')}</div>
  ${edit ? '' : `<h2>3. 개인정보 수집·이용 동의</h2>
  <div class="consent">
   <b>[초안 - 사내 양식으로 교체 필요]</b><br>
   1. 수집 항목: 성명, 주민등록번호(외국인등록번호), 국적, 주소, 연락처, 소속, 직종, 신분증 사진, 기초안전보건교육 이수증 사진, 서명<br>
   2. 이용 목적: 근로계약 체결, 출입관리, 신규채용시 안전교육 실시 및 기록, 산업안전보건법령상 의무 이행<br>
   3. 보유 기간: 근로 종료 후 관련 법령에서 정한 기간<br>
   4. 동의를 거부할 권리가 있으나, 거부 시 현장 출입 및 근로계약 체결이 제한될 수 있습니다.
  </div>
  <label style="font-weight:normal"><input type="checkbox" id="f_agree"> 위 개인정보 수집·이용에 동의합니다. <span class="r">*</span></label>`}
  <h2>${edit ? '3' : '4'}. 서명</h2>
  <div class="muted">${edit ? '바꿀 때만 다시 서명하세요. 그대로 두면 기존 서명이 유지됩니다.' : '아래 칸에 손가락으로 서명해 주세요. 동의서 · 근로계약서 · 안전교육 서약서에 사용됩니다.'}</div>
  <canvas class="sig" id="sig" width="700" height="220"></canvas>
  <div class="row" style="margin-top:6px"><button type="button" class="sm" id="sigclr">서명 지우기</button></div>
  <button class="pri big" id="submit">${edit ? '수정 저장' : '등록하기'}</button>
  </div>`;
  const photos = { id: null, cert: null };
  const pad = sigPad($('#sig'));
  $('#sigclr').onclick = () => pad.clear();
  $('#f_rrn').oninput = e => e.target.value = fmtRrn(e.target.value);
  $('#f_tel').oninput = e => e.target.value = fmtTel(e.target.value);
  for (const k of ['id', 'cert']) {
    $('#p_' + k).onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try { photos[k] = await shrink(file); $('#v_' + k).src = photos[k]; }
      catch { alert('사진을 읽을 수 없습니다. 다시 선택해 주세요.'); }
    };
  }
  let busy = false;
  $('#submit').onclick = async () => {
    if (busy) return;
    const v = id => $('#' + id).value.trim();
    const rrnIn = v('f_rrn'), rrnOrig = f.rrn || '';
    const rrnSame = edit && rrnIn === rrnOrig;
    const miss = [];
    if (!v('f_name')) miss.push('성명');
    if (!rrnSame && !/^\d{6}-\d{7}$/.test(rrnIn)) miss.push('주민(외국인)등록번호 13자리');
    if (!v('f_nat')) miss.push('국적'); if (v('f_tel').replace(/\D/g, '').length < 10) miss.push('연락처');
    if (!v('f_addr')) miss.push('주소'); if (!v('f_co')) miss.push('소속'); if (!v('f_job')) miss.push('직종');
    if (!edit) {
      if (!photos.id) miss.push('신분증 사진'); if (!photos.cert) miss.push('이수증 사진');
      if (!$('#f_agree').checked) miss.push('개인정보 동의 체크'); if (!pad.has()) miss.push('서명');
    }
    if (miss.length) return alert('다음 항목을 확인해 주세요:\n- ' + miss.join('\n- '));
    const fields = { name: v('f_name'), rrn: rrnSame ? rrnOrig : (CONFIG.storeFullRrn ? rrnIn : rrnIn.slice(0, 8)), nat: v('f_nat'), tel: v('f_tel'), addr: v('f_addr'), co: v('f_co'), job: v('f_job') };
    busy = true; $('#submit').textContent = edit ? '저장 중...' : '등록 중...';
    const reset = () => { busy = false; $('#submit').textContent = edit ? '수정 저장' : '등록하기'; };
    try {
      if (edit) {
        const upd = { ...fields, updatedAt: serverTimestamp() };
        if (photos.id) upd.idPhoto = photos.id;
        if (photos.cert) upd.certPhoto = photos.cert;
        if (pad.has()) upd.sign = pad.data();
        await updateDoc(doc(db, COL, ctx.id), upd);
        if (admin) { alert('수정되었습니다.'); location.hash = '#/admin'; return; }
        saveMine({ id: ctx.id, f: fields });
      } else {
        const id = newId();
        await setDoc(doc(db, COL, id), { ...fields, idPhoto: photos.id, certPhoto: photos.cert, sign: pad.data(), createdAt: serverTimestamp(), todayDate: '', eduDone: false });
        saveMine({ id, f: fields });
      }
    } catch (e) {
      reset();
      if (e.code === 'permission-denied' && edit) return alert('안전교육 완료 처리된 뒤에는 직접 수정할 수 없습니다.\n안전관리자에게 요청해 주세요.');
      return alert('처리에 실패했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.\n(' + e.code + ')');
    }
    $('#app').innerHTML = `<div class="wrap"><div class="card" style="text-align:center;margin-top:40px">
      <h1 class="ok">${edit ? '수정 완료' : '등록 완료'}</h1><p><b>${esc(fields.name)}</b>님, ${edit ? '수정되었습니다.' : '등록되었습니다.<br>안전관리자에게 안전교육을 받으러 가세요.'}</p>
      <p class="muted">${edit ? '' : '잘못 입력한 내용이 있으면 이 QR을 다시 찍고 “내 정보 수정하기”를 누르세요.'}</p></div></div>`;
  };
}

/* ============ 관리자 화면 ============ */
let adminFilter = 'all';
function viewAdmin() {
  const t = todayStr();
  const list = workers;
  const todayList = list.filter(w => w.todayDate === t);
  const shown = adminFilter === 'today' ? todayList : list;
  const when = w => (w.createdAt && w.createdAt.toDate) ? w.createdAt.toDate().toLocaleString('ko-KR') : '';
  $('#app').innerHTML = `<div class="wrap">
  <div class="row" style="justify-content:space-between"><h1>${esc(CONFIG.appName)} - 관리자</h1><button class="sm" id="logout">로그아웃</button></div>
  ${CONFIG.siteName ? `<div class="muted">${esc(CONFIG.siteName)}</div>` : ''}
  <div class="card"><b>금일 출력 ${todayList.length}명</b> 중 교육 완료 <span class="ok">${todayList.filter(w => w.eduDone).length}</span>명 / 교육 전 <span class="no">${todayList.filter(w => !w.eduDone).length}</span>명</div>
  <div class="card row" style="align-items:flex-start">
    <div id="qr"></div>
    <div style="flex:1;min-width:200px"><b>근로자 등록 QR</b>
      <div class="muted">교육장에 출력해 붙이거나 화면으로 보여주세요.</div>
      <div class="muted" style="word-break:break-all;margin-top:4px" id="qrurl"></div></div>
  </div>
  <div class="row tabs" style="margin:10px 0">
    <button class="${adminFilter === 'all' ? 'on' : ''}" id="t_all">전체 (${list.length})</button>
    <button class="${adminFilter === 'today' ? 'on' : ''}" id="t_today">금일 출력 (${todayList.length})</button>
  </div>
  ${shown.length ? shown.map(w => `
   <div class="card">
    <div class="row" style="justify-content:space-between">
      <div><b style="font-size:17px">${esc(w.name)}</b> <span class="muted">${esc(w.co)} / ${esc(w.job)} / ${esc(w.nat)}</span><br>
        <span class="muted">${esc(maskRrn(w.rrn))} · ${esc(w.tel)} · 등록 ${when(w)}</span></div>
      <div><span class="${w.idPhoto && w.certPhoto ? 'ok' : 'no'}">${w.idPhoto && w.certPhoto ? '자료 등록 완료' : '사진 누락'}</span><br>
        <span class="${w.eduDone ? 'ok' : 'no'}">${w.eduDone ? '교육 완료' : '교육 전'}</span></div>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="sm" data-a="today" data-id="${w.id}">${w.todayDate === t ? '금일 출력 해제' : '금일 출력 지정'}</button>
      <button class="sm" data-a="edu" data-id="${w.id}">${w.eduDone ? '교육 완료 취소' : '교육 완료 처리'}</button>
      <button class="sm" data-a="photo" data-id="${w.id}">사진 보기</button>
      <a class="btn sm" href="#/edit/${w.id}">정보 수정</a>
      <a class="btn sm" href="#/print/contract/${w.id}">근로계약서</a>
      <a class="btn sm" href="#/print/edu/${w.id}">안전교육·보호구 지급</a>
      <button class="sm" data-a="del" data-id="${w.id}">삭제</button>
    </div>
   </div>`).join('') : '<div class="card muted">표시할 등록자가 없습니다.</div>'}
  <p><a href="#/">← 처음으로</a></p></div>`;
  const url = location.href.split('#')[0] + '#/register';
  $('#qrurl').textContent = url;
  if (window.QRCode) new QRCode($('#qr'), { text: url, width: 150, height: 150 });
  else $('#qr').textContent = '(QR 라이브러리를 불러오지 못했습니다)';
  $('#logout').onclick = () => signOut(auth);
  $('#t_all').onclick = () => { adminFilter = 'all'; viewAdmin(); };
  $('#t_today').onclick = () => { adminFilter = 'today'; viewAdmin(); };
  document.querySelectorAll('[data-a]').forEach(btn => btn.onclick = async () => {
    const w = workers.find(x => x.id === btn.dataset.id); if (!w) return;
    const ref = doc(db, COL, w.id), a = btn.dataset.a;
    try {
      if (a === 'today') await updateDoc(ref, { todayDate: w.todayDate === t ? '' : t });
      else if (a === 'edu') await updateDoc(ref, { eduDone: !w.eduDone });
      else if (a === 'del') { if (confirm(w.name + ' 님의 등록 자료를 삭제할까요? (복구 불가)')) await deleteDoc(ref); }
      else if (a === 'photo') {
        const m = document.createElement('div'); m.className = 'modal';
        m.innerHTML = `<button id="mc">닫기</button><div style="color:#fff;margin-top:8px">신분증</div><img src="${w.idPhoto}"><div style="color:#fff">기초안전보건교육 이수증</div><img src="${w.certPhoto}">`;
        document.body.appendChild(m); m.querySelector('#mc').onclick = () => m.remove();
      }
    } catch (e) { alert('처리에 실패했습니다: ' + e.code); }
  });
}

/* ============ 출력물 ============ */

async function viewPrint(kind, id) {
  const w = workers.find(x => x.id === id);
  if (!w) { $('#app').innerHTML = '<div class="wrap">자료를 찾을 수 없습니다. <a href="#/admin">돌아가기</a></div>'; return; }

    body = `<h3>건설일용근로자 표준근로계약서</h3>

    <div>1. 근로계약기간 : <span class="b" data-e></span>년 <span class="b" data-e></span>월 <span class="b" data-e></span>일부터 <span class="b" data-e></span>년 <span class="b" data-e></span>월 <span class="b" data-e></span>일까지<br>
     <span class="n">&nbsp;&nbsp;&nbsp;※ 근로계약기간을 정하지 않는 경우에는 “근로개시일”만 기재</span></div>
    <div>2. 근 무 장 소 : <span class="b x" data-e>${esc(CONFIG.siteName)}</span></div>
    <div>3. 업무의 내용(직종) : <span class="b x" data-e>${esc(w.job)}</span></div>
    <div>4. 소정근로시간 : <span class="b" data-e></span>시 <span class="b" data-e></span>분부터 <span class="b" data-e></span>시 <span class="b" data-e></span>분까지 (휴게시간 : <span class="b" data-e></span>시 <span class="b" data-e></span>분 ~ <span class="b" data-e></span>시 <span class="b" data-e></span>분)</div>
    <div>5. 근무일/휴일 : 매주 <span class="b" data-e></span>일(또는 매일단위)근무, 주휴일 매주 <span class="b" data-e></span>요일(해당자에 한함)<br>
     <span class="n">&nbsp;&nbsp;&nbsp;※ 주휴일은 1주간 소정근로일을 모두 근로한 경우에 주당 1일을 유급으로 부여</span></div>
    <div>6. 임 금<br>
     &nbsp;- 월(일, 시간)급 : <span class="b w" data-e></span>원(해당사항에 ○표)<br>
     &nbsp;- 상여금 : 있음 ( <span class="b" data-e></span> ) <span class="b w" data-e></span>원, 없음 ( <span class="b" data-e></span> )<br>
     &nbsp;- 기타 제수당(시간외·야간·휴일근로수당 등) : <span class="b w" data-e></span>원(내역별 기재)<br>
     &nbsp;&nbsp;· 시간외 근로수당 : <span class="b w" data-e></span>원(월 <span class="b" data-e></span>시간분)<br>
     &nbsp;&nbsp;· 야간 근로수당 : <span class="b w" data-e></span>원(월 <span class="b" data-e></span>시간분)<br>
     &nbsp;&nbsp;· 휴일 근로수당 : <span class="b w" data-e></span>원(월 <span class="b" data-e></span>시간분)<br>
     &nbsp;- 임금지급일 : 매월(매주 또는 매일) <span class="b" data-e></span>일(휴일의 경우는 전일 지급)<br>
     &nbsp;- 지급방법 : 근로자에게 직접지급( <span class="b" data-e></span> ), 근로자 명의 예금통장에 입금( <span class="b" data-e></span> )</div>
    <div>7. 연차유급휴가<br>&nbsp;- 연차유급휴가는 근로기준법에서 정하는 바에 따라 부여함</div>
    <div>8. 사회보험 적용여부(해당란에 체크)<br>&nbsp;<span class="ck" data-e>□</span> 고용보험 &nbsp;<span class="ck" data-e>□</span> 산재보험 &nbsp;<span class="ck" data-e>□</span> 국민연금 &nbsp;<span class="ck" data-e>□</span> 건강보험</div>
    <div>9. 근로계약서 교부<br>&nbsp;- “사업주”는 근로계약을 체결함과 동시에 본 계약서를 사본하여 “근로자”의 교부요구와 관계없이 “근로자”에게 교부함(근로기준법 제17조 이행)</div>
    <div>10. 근로계약, 취업규칙 등의 성실한 이행의무<br>&nbsp;- 사업주와 근로자는 각자가 근로계약, 취업규칙, 단체협약을 지키고 성실하게 이행하여야 함</div>
    <div>11. 기 타<br>&nbsp;- 이 계약에 정함이 없는 사항은 근로기준법령에 의함</div>
    <div style="text-align:center;margin:14px 0"><span class="b" data-e>${Y}</span>년 <span class="b" data-e>${M}</span>월 <span class="b" data-e>${D}</span>일</div>
    <div>(사업주) 사업체명 : <span class="b x" data-e>${esc(CONFIG.companyName)}</span> (전화 : <span class="b w" data-e></span>)<br>
     &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;주 소 : <span class="b x" data-e></span> 대 표 자 : <span class="b w" data-e></span> (서명)</div>
    <div style="margin-top:8px">(근로자) 주 소 : <b>${esc(w.addr)}</b><br>
     &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;연 락 처 : <b>${esc(w.tel)}</b> &nbsp; 성 명 : <b>${esc(w.name)}</b> (서명) ${sig}</div>`;
  } else {
    const rules = ['현장 출·퇴근시간 준수 및 작업복은 항상 단정히 착용한다.', '안전모, 안전대 등 개인보호구는 항상 착용하고 작업에 임한다.', '현장내 이동시 안전한 작업로를 이용하고 정숙보행한다.', '규정된 장소 이외에서의 끽연, 방뇨를 금하며 현장내에서는 절대로 음주행위는 금한다.', '위험기계·기구(둥근톱, 용접기 등) 사용시 안전장치의 설치 및 작동상태를 점검한 후 사용하고 임의로 해체하지 않는다.', '전기기계·기구 사용시 전선의 피복상태, 스위치의 휴즈, 누전차단기 작동상태 등을 사전에 점검하고 젖은 장갑착용 및 습지에서의 사용을 금한다.', '현장내에서 화기 취급시 안전관리자 또는 작업책임자의 허락을 받고 작업후 불씨 제거상태를 필히 확인한다.', '작업중 위험요소 확인시 반드시 안전관리자 또는 작업책임자에게 보고하여 안전조치를 취한 후 작업을 재개한다.', '현장에서 실시하는 안전교육, 안전행사에 적극 참여하여 내 자신의 안전은 스스로 지킬 수 있도록 노력한다.', '기타 안전수칙 및 안전규정을 준수하고 나의 안전은 내 자신은 물론 가족과 동료, 회사 및 국가의 안전과 발전에 원동력임을 깊이 인식하여야 한다.'];
    const c = '①②③④⑤⑥⑦⑧⑨⑩';
    body = `<h3>신규채용시 안전교육 및 보호구 지급현황</h3>
    <table class="f">
     <tr><th width="18%">소속 및 직종</th><td>${esc(w.co)} / ${esc(w.job)}</td><th width="14%">성 명</th><td>${esc(w.name)}</td></tr>
     <tr><th>주민등록번호</th><td>${esc(printRrn(w.rrn))}</td><th>교육시간</th><td data-e>&nbsp;</td></tr>
     <tr><th>주 소</th><td>${esc(w.addr)}</td><th>연 락 처</th><td>${esc(w.tel)}</td></tr>
    </table>
    <b>1. 교육내용</b>
    <div class="n" style="line-height:1.6">${rules.map((r, i) => `${c[i]} ${r}`).join('<br>')}</div>
    <b>2. 보호구 지급현황</b>
    <table class="f">
     <tr><th>보호구의 종류</th><th>규 격</th><th>수 량</th><th>비 고</th></tr>
     <tr><td align="center">안 전 모</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td></tr>
     <tr><td align="center">안 전 화</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td></tr>
     <tr><td align="center">안 전 대</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td><td data-e>&nbsp;</td></tr>
    </table>
    <b>3. 서 약 서</b>
    <div class="n">본인은 상기와 같이 신규채용시 교육을 이수하였으며 지급된 보호구는 항상 착용후 작업에 임함은 물론 보호구 미착용으로 인한 사고, 과태료 부과 등 불이익에 대하여 이의를 제기하지 않을 것을 서약합니다.</div>
    <table class="f" style="width:40%;margin-left:auto">
     <tr><th rowspan="2" width="20%">결재</th><th>담 당</th><th>소 장</th></tr>
     <tr><td height="46" data-e></td><td data-e></td></tr>
    </table>
    <div style="text-align:center;margin:10px 0">${Y}년 ${M}월 ${D}일</div>
    <div style="text-align:right">성 명 : <b>${esc(w.name)}</b> (인) ${sig}</div>
    <div style="margin-top:8px"><b>${esc(CONFIG.siteName)} 현장 소장 귀하</b></div>`;
  }
  const fillKey = kind === 'contract' ? 'contractFill' : 'eduFill';
  $('#app').innerHTML = `<div class="wrap no-print">
    <div class="row"><a class="btn" href="#/admin">← 관리자 화면</a>
    <button class="pri" id="p_save">저장</button>
    <button id="p_print">저장 후 인쇄 / PDF</button>
    <span class="muted" id="p_stat"></span></div>
    <div class="muted" style="margin-top:6px">※ 노란 칸을 눌러 직접 작성하세요. □ 는 누르면 체크됩니다. 작성한 뒤 저장하면 다음에 열어도 그대로 불러옵니다.</div></div>
    <div class="paper">${body}</div>`;
  const els = [...document.querySelectorAll('.paper [data-e]')];
  const saved = w[fillKey] || {};
  let dirty = false;
  const mark = () => { dirty = true; $('#p_stat').textContent = '수정됨 (저장 필요)'; };
  els.forEach((el, i) => {
    if (saved[i] !== undefined) el.textContent = saved[i];
    if (el.classList.contains('ck')) {
      el.onclick = () => { el.textContent = el.textContent.trim() === '□' ? '☑' : '□'; mark(); };
    } else {
      el.contentEditable = 'true';
      el.onkeydown = e => { if (e.key === 'Enter') e.preventDefault(); };
      el.onpaste = e => { e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData || window.clipboardData).getData('text').replace(/\s+/g, ' ')); };
      el.oninput = mark;
    }
  });
  const save = async () => {
    const o = {}; els.forEach((el, i) => { o[i] = el.textContent; });
    $('#p_stat').textContent = '저장 중...';
    try { await updateDoc(doc(db, COL, w.id), { [fillKey]: o }); dirty = false; $('#p_stat').textContent = '저장되었습니다.'; return true; }
    catch (e) { $('#p_stat').textContent = '저장 실패: ' + e.code; return false; }
  };
  $('#p_save').onclick = save;
  $('#p_print').onclick = async () => { if (!dirty || await save()) window.print(); };
}

if (configured) setupAuth();
route();
</script>
</body>
</html>
